# =========================================================================
# Arch Smart Update - Main Configuration File
#
# NOTE: If you are reading this in the '.default.conf' file, DO NOT edit it,
# as it will be overwritten by updates. Edit 'settings.conf' instead.
# =========================================================================

# --- 1. General Settings ---
# Set to true to always ask if you want to refresh mirrors before syncing databases.
PROMPT_MIRROR_REFRESH=true

# Number of Pacman DB backups to keep in /var/lib/pacman/backup/
MAX_BACKUP_COPIES=5

# Override the default AUR helper (e.g. "yay", "pikaur"). Leave empty to auto-detect.
AUR_HELPER_OVERRIDE=""

# Automatically run system cleanup after a successful update (orphans, package cache, journals).
ENABLE_POST_CLEANUP=false

# Check for outdated AUR packages needing rebuild against newer system libraries (requires 'rebuild-detector').
ENABLE_AUR_REBUILD_CHECK=true

# Minimum required free space (in MB) on root and cache partitions before applying updates.
MIN_DISK_SPACE_MB=2048
MIN_BTRFS_SPACE_MB=4608

# --- 2. Update Delays (Hours) ---
# Minimum age for ANY package (allows mirrors to fully sync).
T_MIRROR_H=3

# Delay for FEATURE packages (e.g., pipewire, networkmanager).
T_FEAT_H=6

# Delay for CRITICAL packages (e.g., base, mesa, xorg, wayland).
T_CRIT_H=12

# Delay for Desktop Environments (e.g., Plasma, Gnome, Hyprland).
T_DE_H=12

# Delay for NUCLEAR / Core system packages (e.g., linux, glibc, systemd).
T_NUKE_H=24

# If true, minor "Patch" updates ignore category timers and use only T_MIRROR_H.
IGNORE_PATCH_TIMERS=true

# --- 3. Background Checker Settings ---
# Enable periodic background checks and desktop notifications via systemd user timer.
ENABLE_BACKGROUND_CHECK=false

# How often to check for updates in the background (e.g. 30min, 1h, 2h, 1d).
CHECK_INTERVAL=90min

# Delay before running the first check after system boot (e.g. 2min, 5min, 10min).
START_DELAY=5min

# Snooze duration when clicking the "Silence" button in a notification (e.g. 6h, 12h, 1d).
SILENCE_UPDATES=6h

# Notification display timeout in milliseconds for safe updates.
# Set to 0 to keep the notification persistent in the notification center until clicked/dismissed.
# Examples: 0 (persistent/infinite), 60000 (1 minute), 120000 (2 minutes)
NOTIFICATION_TIMEOUT=60000

# --- 4. Logging ---
GENERATE_LOGS=false
MAX_LOG_NUMBERS=5
# If set to 5, you will get 5 'log' files + 5 'daemon_log' files = 10 logs in total

# --- 5. Mirror Ranking Commands ---
# The script uses 'rate-mirrors' as the primary ranking tool (fastest),
# falling back to 'reflector' if 'rate-mirrors' is unavailable or fails.

# Uncomment and edit below to override default parameters for either tool.
# CUSTOM_RATE_MIRRORS_CMD="sudo rate-mirrors --allow-root --concurrency=30 --disable-comments-in-file --save=/etc/pacman.d/mirrorlist --protocol=https arch"
# CUSTOM_REFLECTOR_CMD="sudo reflector --country Germany,Netherlands,France,Norway --protocol https --age 12 --latest 50 --number 20 --sort rate --save /etc/pacman.d/mirrorlist --download-timeout 10"

# --- 6. Custom Update Commands ---
# Extra commands to run during the update.
# If you include pacman, yay, or paru here, the default system update will be DISABLED.
# Write one command per line inside quotes for a combined approach, as shown in the example below.
#
# NOTE: Active custom commands are strictly validated for safety.
# If you enable or modify CUSTOM_CMDS, the background monitor (--daemon) will pause
# and trigger a desktop alert to prevent the execution of unverified tasks. You MUST run
# this script manually in an interactive terminal once after any modifications to
# the settings.conf file to authorize the changes and confirm that you trust them.
CUSTOM_CMDS=(
    # "flatpak update -y"
    # "paru -Syu"
)

# --- 7. User Packages ---
# Add your own packages to the existing update categories here.
USER_NUCLEAR_PKGS=(
    # "my-custom-kernel"
    # "other-nuclear-package"
)

USER_CRITICAL_PKGS=(
    # "my-critical-app"
    # "other-critical-package"
)

USER_FEATURE_PKGS=(
    # "my-feature-app"
    # "other-feature-package"
)
